<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GRS | Friendship Day</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600;700&family=Cormorant+Garamond:wght@600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/responsive.css">

</head>

<body>

    <!-- =========================
            SKY
    ========================== -->

    <main class="sky">

        <!-- Sun -->
        <div class="sun-glow" aria-hidden="true"></div>
        <div class="sun" aria-hidden="true"></div>

        <!-- Clouds -->
        <div class="cloud cloud1" aria-hidden="true"></div>
        <div class="cloud cloud2" aria-hidden="true"></div>
        <div class="cloud cloud3" aria-hidden="true"></div>
        <div class="cloud cloud4" aria-hidden="true"></div>

        <!-- Ambient details -->
        <div class="sparkles" aria-hidden="true"></div>

        <!-- =========================
                HERO
        ========================== -->

        <section class="hero">

            <h1 id="grs">
                <span class="letter">G</span>
                <span class="letter">R</span>
                <span class="letter">S</span>
            </h1>

            <p class="gift">Gift For</p>

            <h2 class="name">Rashmi Sharma</h2>

            <button id="beginBtn" type="button">Tap To Begin &#10024;</button>

        </section>

        <!-- =========================
                ENVELOPE
        ========================== -->

        <section class="envelope-stage" aria-hidden="true">

            <div class="envelope-wrap">

                <div class="envelope-shadow"></div>

                <div class="envelope" role="button" aria-label="Open envelope" tabindex="0">
                    <div class="envelope-back"></div>
                    <div class="envelope-liner"></div>
                    <div class="letter-sheet">
                        <div class="letter-paper">
                            <p class="letter-greeting">Dear Rashmi,</p>
                            <p class="letter-copy">Happy Friendship Day Dushmi ✨ tu meri bestie forever hai… mein bhi hoo na tera? 💛</p>
                        </div>
                    </div>
                    <div class="envelope-pocket envelope-pocket-left"></div>
                    <div class="envelope-pocket envelope-pocket-right"></div>
                    <div class="envelope-pocket envelope-pocket-bottom"></div>
                    <div class="envelope-flap"></div>
                    <div class="envelope-seal"></div>
                    <p class="envelope-tap-hint">Tap to open ✉</p>
                    <div class="envelope-highlight"></div>
                </div>

            </div>

        </section>

    </main>

    <!-- JS -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <script src="js/envelope.js"></script>
    <script src="js/main.js"></script>

</body>

</html>
