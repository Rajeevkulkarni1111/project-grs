<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GRS | Friendship Day</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/responsive.css">

</head>

<body>

    <!-- =========================
            SKY
    ========================== -->

    <main class="sky">

        <!-- Sun -->
        <div class="sun-glow"></div>
        <div class="sun"></div>

        <!-- Clouds -->
        <div class="cloud cloud1"></div>
        <div class="cloud cloud2"></div>
        <div class="cloud cloud3"></div>
        <div class="cloud cloud4"></div>

        <!-- Ambient details -->
        <div class="sparkles"></div>

        <!-- =========================
                HERO
        ========================== -->

        <section class="hero">

            <h1 id="grs">
                <span class="letter">G</span>
                <span class="letter">R</span>
                <span class="letter">S</span>
            </h1>

            <p class="gift">Gift For</p>

            <h2 class="name">Rashmi Sharma</h2>

            <button id="beginBtn">Tap To Begin &#10024;</button>

        </section>

    </main>

    <!-- JS -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <script src="js/main.js"></script>

</body>

</html>
